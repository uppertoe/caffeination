<header
  class="dash-header"
  id="dash-header"
  x-data="{ confirmingDelete: false }"
  @keydown.escape.window="confirmingDelete = false"
>
  <h1>Hi, {{ user.display_name }}</h1>
  <span class="row-actions">
    <button
      type="button"
      class="secondary outline header-action"
      hx-get="/me/name/edit"
      hx-target="#dash-header"
      hx-swap="outerHTML"
    >Change name</button>
    <button
      type="button"
      class="secondary outline header-action"
      hx-post="/logout"
      hx-target="#app"
      hx-swap="innerHTML"
    >Log out</button>
    <button
      type="button"
      class="secondary outline header-action danger"
      @click="confirmingDelete = true"
      hx-get="/me/delete"
      hx-target="#delete-confirm"
      hx-swap="innerHTML"
    >Delete</button>
  </span>

  {# The confirmation's card (_delete_confirm.html) is fetched when the
     dialog opens, so its count of open orders is current. #}
  <dialog :open="confirmingDelete">
    <article id="delete-confirm"></article>
  </dialog>
</header>
